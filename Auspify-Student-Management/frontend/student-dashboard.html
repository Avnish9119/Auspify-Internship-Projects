
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172554}
header{background:#101b3f;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{font-size:21px;margin:0}
button{background:#2456a6;color:white;border:0;border-radius:8px;padding:11px 17px;font-weight:bold;cursor:pointer}
main{max-width:1100px;margin:30px auto;padding:0 18px}
.card{background:white;padding:22px;border-radius:14px;box-shadow:0 4px 18px #0f172a0c;margin-bottom:20px;overflow-x:auto}
h2,h3{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.info{background:#eff6ff;padding:15px;border-radius:10px}
.info span{display:block;color:#64748b;font-size:13px;margin-bottom:7px}
.info strong{font-size:16px;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;min-width:450px}
th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0}
th{background:#eff6ff}
#message{color:#b91c1c;font-weight:bold}
.muted{color:#64748b}
@media(max-width:560px){header{padding:16px 18px}.card{padding:16px}}
</style>
</head>
<body>
<header>
  <h1>Student Management System</h1>
  <button id="logoutButton">Logout</button>
</header>

<main>
  <section class="card">
    <h2>Student Dashboard</h2>
    <p id="welcome" class="muted">Loading your dashboard...</p>
    <p id="message"></p>
    <div class="grid" id="profile"></div>
  </section>

  <section class="card">
    <h3>My Attendance</h3>
    <table>
      <thead><tr><th>Date</th><th>Status</th></tr></thead>
      <tbody id="attendance"></tbody>
    </table>
  </section>

  <section class="card">
    <h3>My Marks & Results</h3>
    <table>
      <thead>
        <tr><th>Subject</th><th>Exam</th><th>Obtained</th><th>Maximum</th></tr>
      </thead>
      <tbody id="marks"></tbody>
    </table>
  </section>
</main>

<script>
const API = "http://localhost:5001";
const token = sessionStorage.getItem("authToken");

function escapeHTML(value) {
  return String(value ?? "-").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[c]));
}

document.getElementById("logoutButton").addEventListener("click", () => {
  sessionStorage.removeItem("loggedInUser");
  sessionStorage.removeItem("authToken");
  window.location.replace("login.html");
});

async function loadDashboard() {
  const message = document.getElementById("message");

  try {
    const user = JSON.parse(sessionStorage.getItem("loggedInUser") || "null");

    if (!token || !user || user.role !== "student") {
      window.location.replace("login.html");
      return;
    }

    const response = await fetch(API + "/api/student/dashboard", {
      headers: { Authorization: "Bearer " + token }
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Dashboard load nahi hua.");
    }

    const s = data.student;
    document.getElementById("welcome").textContent = "Welcome, " + s.name + "!";

    const fields = [
      ["Name", s.name],
      ["Roll Number", s.roll_no],
      ["Email", s.email],
      ["Phone", s.phone],
      ["Branch", s.branch],
      ["Semester", s.semester]
    ];

    document.getElementById("profile").innerHTML = fields.map(([label,value]) =>
      `<div class="info"><span>${label}</span><strong>${escapeHTML(value)}</strong></div>`
    ).join("");

    const attendance = data.attendance || [];
    document.getElementById("attendance").innerHTML = attendance.length
      ? attendance.map(a => `<tr>
          <td>${escapeHTML(a.attendance_date)}</td>
          <td>${escapeHTML(a.status)}</td>
        </tr>`).join("")
      : '<tr><td colspan="2">No attendance records found.</td></tr>';

    const marks = data.marks || [];
    document.getElementById("marks").innerHTML = marks.length
      ? marks.map(m => `<tr>
          <td>${escapeHTML(m.subject)}</td>
          <td>${escapeHTML(m.exam_name)}</td>
          <td>${escapeHTML(m.marks_obtained)}</td>
          <td>${escapeHTML(m.max_marks)}</td>
        </tr>`).join("")
      : '<tr><td colspan="4">No marks records found.</td></tr>';

  } catch (error) {
    message.textContent = error.message;
  }
}

loadDashboard();
</script>
</body>
</html>
