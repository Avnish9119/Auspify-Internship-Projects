<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Auspify Student Management</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f1f5f9;font-family:Arial,sans-serif;color:#172554}
    .card{width:min(100%,420px);background:#fff;padding:32px;border-radius:16px;box-shadow:0 10px 35px #0f172a12}
    h1{margin:0 0 8px;font-size:25px}.muted{color:#64748b;line-height:1.5;margin:0 0 24px}
    label{display:block;margin:16px 0 7px;font-weight:600;font-size:14px}
    input,select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;background:white}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:8px;background:#2456a6;color:white;font-weight:700;font-size:15px;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}#message{min-height:22px;margin:16px 0 0;font-size:14px;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <main class="card">
    <h1>Student Management System</h1>
    <p class="muted">Sign in with the account provided by your administrator.</p>
    <form id="loginForm">
      <label for="username">Username</label><input id="username" autocomplete="username" required>
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
      <label for="role">Login as</label>
      <select id="role" required>
        <option value="admin">Admin</option><option value="teacher">Teacher</option><option value="student">Student</option>
      </select>
      <button id="submitButton" type="submit">Login</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitButton");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true; message.textContent = "Signing in...";
      try {
        const response = await fetch("http://localhost:5001/api/login", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            username:document.getElementById("username").value.trim(),
            password:document.getElementById("password").value,
            role:document.getElementById("role").value
          })
        });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || "Login failed.");
        sessionStorage.setItem("loggedInUser", JSON.stringify(data.user));
        sessionStorage.setItem("authToken", data.token);
        const destination = data.user.role === "admin" ? "admin-dashboard.html"
          : data.user.role === "teacher" ? "teacher-dashboard.html" : "student-dashboard.html";
        window.location.href = destination;
      } catch (error) {
        message.style.color = "#dc2626"; message.textContent = error.message;
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
